<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentHub Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6/css/xterm.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #1a1b26; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    #web-status-bar {
      flex-shrink: 0;
      height: 32px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background-color: #16161e;
      border-bottom: 1px solid #292e42;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Menlo, Monaco, monospace;
      font-size: 12px;
      color: #565f89;
    }
    #web-status-bar .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    #web-status-bar .status-dot--connected    { background-color: #9ece6a; }
    #web-status-bar .status-dot--disconnected { background-color: #f7768e; }
    #web-status-bar .status-dot--connecting   { background-color: #e0af68; }
    #web-status-bar .session-info {
      color: #a9b1d6;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #web-status-bar .separator {
      color: #414868;
    }
    #terminal { flex: 1; min-height: 0; width: 100%; }
  </style>
</head>
<body>
  <div id="web-status-bar">
    <span class="status-dot status-dot--connecting" id="status-dot"></span>
    <span class="session-info" id="session-info">Connecting...</span>
  </div>
  <div id="terminal"></div>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@6/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.11/lib/addon-fit.js"></script>
  <script>
    // Binary framing protocol constants (must match relay/protocol.go)
    const MsgOutput  = 0x01;
    const MsgInput   = 0x10;
    const MsgResize2 = 0x11;
    const MsgPing    = 0x12;

    function makeFrame(type, payload) {
      const frame = new Uint8Array(1 + payload.length);
      frame[0] = type;
      frame.set(payload, 1);
      return frame;
    }

    function makeInputFrame(text) {
      const enc = new TextEncoder().encode(text);
      return makeFrame(MsgInput, enc);
    }

    function makeResizeFrame(cols, rows) {
      const payload = new Uint8Array(4);
      payload[0] = (cols >> 8) & 0xff;
      payload[1] = cols & 0xff;
      payload[2] = (rows >> 8) & 0xff;
      payload[3] = rows & 0xff;
      return makeFrame(MsgResize2, payload);
    }

    // Extract session ID from URL path: /sessions/{id}
    const pathParts = location.pathname.split('/');
    const sessionID = pathParts[pathParts.indexOf('sessions') + 1] || '';

    // Extract optional token from query params
    const params = new URLSearchParams(location.search);
    const token = params.get('token') || '';

    // Build WSS URL
    const wsURL = 'wss://' + location.host + '/sessions/' + encodeURIComponent(sessionID) + '/ws' + (token ? '?token=' + encodeURIComponent(token) : '');

    // Session metadata: fetch once, then poll every 3s for connection state
    let sessionMeta = null;
    const statusDot = document.getElementById('status-dot');
    const sessionInfoEl = document.getElementById('session-info');

    function updateStatusBar(meta, wsConnected) {
      if (meta) {
        var parts = [meta.name || sessionID];
        if (meta.cli_type) parts.push(meta.cli_type);
        if (meta.hostname) parts.push(meta.hostname);
        sessionInfoEl.textContent = parts.join(' \u2502 ');
      }

      statusDot.className = 'status-dot';
      if (wsConnected) {
        statusDot.classList.add('status-dot--connected');
      } else if (meta === null) {
        statusDot.classList.add('status-dot--connecting');
      } else {
        statusDot.classList.add('status-dot--disconnected');
      }
    }

    function fetchSessionInfo() {
      fetch('/api/sessions/' + encodeURIComponent(sessionID) + '/info')
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(data) {
          if (data) {
            sessionMeta = data;
            updateStatusBar(sessionMeta, connected);
          }
        })
        .catch(function() {
          // Fetch failed — server unreachable, mark disconnected
          updateStatusBar(sessionMeta, false);
        });
    }

    fetchSessionInfo();
    setInterval(fetchSessionInfo, 3000);

    // Initialize xterm.js
    const term = new Terminal({
      cursorBlink: true,
      theme: {
        background: '#1a1b26',
        foreground: '#cccccc',
        cursor: '#cccccc',
      },
      fontFamily: 'Menlo, Monaco, "Courier New", monospace',
      fontSize: 14,
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    // Open WebSocket connection
    let ws = null;
    let connected = false;

    function connect() {
      ws = new WebSocket(wsURL);
      ws.binaryType = 'arraybuffer';

      ws.onopen = function() {
        connected = true;
        updateStatusBar(sessionMeta, true);
        // Send initial resize
        if (term.cols && term.rows) {
          ws.send(makeResizeFrame(term.cols, term.rows));
        }
      };

      ws.onmessage = function(evt) {
        const data = new Uint8Array(evt.data);
        if (data.length === 0) return;

        const msgType = data[0];
        const payload = data.slice(1);

        if (msgType === MsgOutput) {
          const text = new TextDecoder().decode(payload);
          term.write(text);
        }
        // Other message types from server are ignored in browser client
      };

      ws.onclose = function(evt) {
        connected = false;
        updateStatusBar(sessionMeta, false);
      };

      ws.onerror = function() {
        connected = false;
        updateStatusBar(sessionMeta, false);
      };
    }

    // Terminal input -> send MsgInput frame
    term.onData(function(data) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(makeInputFrame(data));
      }
    });

    // Terminal resize -> send MsgResize2 frame
    term.onResize(function(size) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(makeResizeFrame(size.cols, size.rows));
      }
    });

    // Window resize -> fit terminal
    window.addEventListener('resize', function() {
      fitAddon.fit();
    });

    connect();
  </script>
</body>
</html>
