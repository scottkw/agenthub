<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentHub Dashboard</title>
  <link rel="stylesheet" href="/assets/dashboard.css">
</head>
<body>
  <div class="container">
    <h1>AgentHub</h1>
    <p>Shared terminal sessions, securely.</p>

    <hr>

    <h2>Join a Shared Session</h2>
    <p>Enter the join code from the person sharing their session, or scan the QR code they shared with your mobile device.</p>

    <form action="/join" method="GET">
      <label for="code">Join Code</label>
      <input id="code" name="code" type="text" placeholder="A7K-4P2N" maxlength="9"
             autocomplete="off" autocapitalize="characters" spellcheck="false" required />
      <button type="submit">Join Session</button>
    </form>

    <p class="hint">On mobile? Scan the QR code to auto-fill the code and open this page.</p>
  </div>

  <script src="/assets/dashboard.js"></script>
</body>
</html>
