name: Distribute

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.13)'
        required: true

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  update-homebrew-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Extract version
        id: version
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Download checksums with retry
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_seconds: 30
          max_attempts: 5
          retry_wait_seconds: 60
          command: |
            curl -fsSL \
              "https://github.com/scottkw/agenthub/releases/download/${RELEASE_TAG}/checksums.txt" \
              -o checksums.txt

      - name: Extract DMG SHA256
        id: sha256
        run: |
          SHA256=$(grep "agenthub-${RELEASE_TAG}-darwin-universal.dmg" checksums.txt | awk '{ print $1 }')
          if [ -z "$SHA256" ]; then
            echo "ERROR: SHA256 not found in checksums.txt"
            cat checksums.txt
            exit 1
          fi
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Checkout tap repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: scottkw/homebrew-agenthub
          ref: ${{ contains(github.ref, '-rc') && 'release-90-test' || 'main' }}
          token: ${{ secrets.TAP_DEPLOY_TOKEN }}
          path: tap

      - name: Update cask formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA256="${{ steps.sha256.outputs.sha256 }}"
          sed -i "s/version \"[^\"]*\"/version \"${VERSION}\"/" tap/Casks/agenthub.rb
          sed -i "s/sha256 \"[^\"]*\"/sha256 \"${SHA256}\"/" tap/Casks/agenthub.rb

      - name: Commit and push formula update
        run: |
          cd tap
          BRANCH="${{ contains(github.ref, '-rc') && 'release-90-test' || 'main' }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/agenthub.rb
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "agenthub ${{ steps.version.outputs.version }}"
          git push origin HEAD:"$BRANCH"

  submit-winget:
    runs-on: windows-latest           # D-08: wingetcreate is .NET+Windows only
    continue-on-error: true           # WinGet first submission pending — remove after accepted
    if: ${{ !contains(github.ref, '-rc') }}   # D-17: skip rc tags
    env:
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
      WINGETCREATE_VERSION: v1.12.8.0
      WINGETCREATE_SHA256: 8BD738851B524885410112678E3771B341C5C716DE60FBBECB88AB0A363ED85D
    steps:
      - name: Checkout (winget manifest templates + populate script)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Download and verify wingetcreate.exe
        shell: pwsh
        run: |
          $url = "https://github.com/microsoft/winget-create/releases/download/$env:WINGETCREATE_VERSION/wingetcreate.exe"
          Invoke-WebRequest -Uri $url -OutFile wingetcreate.exe
          $actual = (Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash
          if ($actual -ne $env:WINGETCREATE_SHA256) {
            Write-Error "SHA256 mismatch: expected $env:WINGETCREATE_SHA256 got $actual"
            exit 1
          }
      - name: Submit to WinGet
        shell: pwsh
        env:
          # DIST-02 (Phase 106 91-B fix): read RELEASE_TAG from the workflow
          # env block (defined at line 13) so both release.published and
          # workflow_dispatch produce a valid tag. The previous
          # github.event.release.tag_name reference is empty on
          # workflow_dispatch, producing an empty `$version` and a
          # double-dash installer URL.
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          # DIST-03 (Phase 106 91-C fix): controls `new` vs `update` for the
          # wingetcreate submission. Set WINGET_FIRST_SUBMISSION=true on the
          # first submission attempt (microsoft/winget-pkgs hasn't accepted
          # scottkw.agenthub yet), then unset for subsequent versions.
          # Defaults to update path so steady-state ships are unchanged.
          WINGET_FIRST_SUBMISSION: ${{ vars.WINGET_FIRST_SUBMISSION || 'false' }}
        run: |
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrEmpty($tag)) {
            Write-Error "RELEASE_TAG is empty — cannot construct installer URL. Check workflow_dispatch input or release event."
            exit 1
          }
          $version = $tag.TrimStart('v')
          $installerUrl = "https://github.com/scottkw/agenthub/releases/download/$tag/agenthub-$tag-windows-amd64-installer.exe"
          Write-Host "Submitting WinGet manifest: tag=$tag version=$version url=$installerUrl mode=$($env:WINGET_FIRST_SUBMISSION -eq 'true' ? 'submit-prepared' : 'update')"
          if ($env:WINGET_FIRST_SUBMISSION -eq 'true') {
            # First submission to microsoft/winget-pkgs — creates the package entry.
            # `wingetcreate new` is an interactive wizard and cannot supply the
            # required Publisher/License/Description non-interactively, so we
            # submit the prepared manifest templates (packaging/winget/manifests)
            # via `wingetcreate submit`. populate-manifests.sh injects the version
            # and the Windows installer SHA256 (read from the release checksums.txt).
            $checksums = "checksums.txt"
            Invoke-WebRequest -Uri "https://github.com/scottkw/agenthub/releases/download/$tag/checksums.txt" -OutFile $checksums
            bash packaging/winget/populate-manifests.sh $version $checksums
            if ($LASTEXITCODE -ne 0) { Write-Error "populate-manifests.sh failed (exit $LASTEXITCODE)"; exit 1 }
            $manifestDir = "packaging/winget/output/$version"
            # Token is read from WINGET_CREATE_GITHUB_TOKEN (job env) — not passed
            # as --token, to avoid the token-in-log warning from wingetcreate.
            .\wingetcreate.exe submit --prtitle "Add scottkw.agenthub version $version" --no-open $manifestDir
          } else {
            # Steady-state path — updates the existing package entry.
            .\wingetcreate.exe update scottkw.agenthub `
              --version $version `
              --urls $installerUrl `
              --submit
          }
          if ($LASTEXITCODE -ne 0) { Write-Error "wingetcreate failed (exit $LASTEXITCODE)"; exit 1 }
