name: Build

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: agenthub
            platform: darwin/universal
            os: macos-latest

          - name: agenthub
            platform: linux/amd64
            os: ubuntu-latest
            webkit_tag: webkit2_41
            webkit_pkg: libwebkit2gtk-4.1-dev

          - name: agenthub
            platform: linux/amd64
            os: ubuntu-22.04
            webkit_pkg: libwebkit2gtk-4.0-dev

          - name: agenthub
            platform: windows/amd64
            os: windows-latest

    runs-on: ${{ matrix.build.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev ${{ matrix.build.webkit_pkg }}

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Run Go tests (all platforms, race detector)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Skip root package on Windows — orphan test processes prevent
            # cleanup of agenthub.test.exe, causing spurious exit code 1.
            go test -race -short ./internal/...
          else
            go test -race -short ./...
          fi

      - name: Run build script tests
        if: runner.os == 'Linux' && matrix.build.os == 'ubuntu-latest'
        run: bash tests/build-script.test.sh

      - name: Run install.sh shellcheck gate
        if: runner.os == 'Linux' && matrix.build.os == 'ubuntu-latest'
        run: bash tests/install-sh.test.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Run frontend tests
        if: runner.os == 'Linux' && matrix.build.os == 'ubuntu-latest'
        run: cd frontend && pnpm install && pnpm test

      - name: Verify traceability paths exist
        if: runner.os == 'Linux' && matrix.build.os == 'ubuntu-latest'
        run: bash tests/check-traceability-paths.sh

      - name: Install Wails CLI (version from go.mod)
        shell: bash
        run: |
          WAILS_VER=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          [ -n "$WAILS_VER" ] || { echo "wails not pinned in go.mod"; exit 1; }
          go install github.com/wailsapp/wails/v2/cmd/wails@"$WAILS_VER"

      - name: Ensure frontend/dist exists for embed
        shell: bash
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep

      - name: Build with Wails
        shell: bash
        run: |
          TAGS="-tags wailsassets"
          if [ -n "${{ matrix.build.webkit_tag }}" ]; then
            TAGS="-tags ${{ matrix.build.webkit_tag }},wailsassets"
          fi
          WEBVIEW2=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            WEBVIEW2="-webview2 download"
          fi
          NSIS=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            NSIS="-nsis"
          fi
          wails build -platform ${{ matrix.build.platform }} $TAGS $WEBVIEW2 $NSIS

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agenthub-darwin-universal
          path: build/bin/agenthub.app
          if-no-files-found: error

      - name: Upload Linux artifact
        if: runner.os == 'Linux' && matrix.build.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agenthub-linux-amd64-ubuntu24
          path: build/bin/AgentHub
          if-no-files-found: error

      - name: Upload Linux 22.04 artifact
        if: runner.os == 'Linux' && matrix.build.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agenthub-linux-amd64-ubuntu22
          path: build/bin/AgentHub
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agenthub-windows-amd64
          path: |
            build/bin/AgentHub-amd64-installer.exe
            build/bin/AgentHub.exe
          if-no-files-found: error
