name: Build

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: agenthub
            platform: darwin/universal
            os: macos-latest

          - name: agenthub
            platform: linux/amd64
            os: ubuntu-latest
            webkit_tag: webkit2_41
            webkit_pkg: libwebkit2gtk-4.1-dev

          - name: agenthub
            platform: linux/amd64
            os: ubuntu-22.04
            webkit_pkg: libwebkit2gtk-4.0-dev

          - name: agenthub
            platform: windows/amd64
            os: windows-latest

    runs-on: ${{ matrix.build.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev ${{ matrix.build.webkit_pkg }}

      - name: Run Go tests
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
        # Setup Go first so we can run tests

      - name: Run Go tests (all platforms, race detector)
        run: go test -race -short ./...

      - name: Run build script tests
        if: runner.os == 'Linux' && matrix.build.os == 'ubuntu-latest'
        run: bash tests/build-script.test.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build with Wails
        uses: dAppServer/wails-build-action@main
        with:
          build-name: ${{ matrix.build.name }}
          build-platform: ${{ matrix.build.platform }}
          build-tags: ${{ matrix.build.webkit_tag }}
          wails-build-webview2: embed
          nsis: ${{ matrix.build.os == 'windows-latest' }}

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: agenthub-darwin-universal
          path: build/bin/agenthub.app
          if-no-files-found: error

      - name: Upload Linux artifact
        if: runner.os == 'Linux' && matrix.build.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: agenthub-linux-amd64-ubuntu24
          path: build/bin/agenthub
          if-no-files-found: error

      - name: Upload Linux 22.04 artifact
        if: runner.os == 'Linux' && matrix.build.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: agenthub-linux-amd64-ubuntu22
          path: build/bin/agenthub
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: agenthub-windows-amd64
          path: |
            build/bin/agenthub-amd64-installer.exe
            build/bin/agenthub.exe
          if-no-files-found: error
