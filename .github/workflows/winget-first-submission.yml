name: WinGet First Submission (one-shot, manual)

# Purpose: spawn a windows-latest runner with an interactive tmate session so
# you can manually run `wingetcreate new` for the very first submission to
# microsoft/winget-pkgs (Phase 106 WINGET_FIRST_SUBMISSION path).
#
# wingetcreate v1.12.8's `new` subcommand requires interactive prompts for
# PackageIdentifier, PackageVersion, License, ShortDescription, etc. — it
# cannot be fully driven by CLI flags. distribute.yml's automated `update`
# path handles all subsequent versions; this workflow only exists for the
# first-time submission.
#
# Delete this file after the first submission is accepted by microsoft.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag for the installer URL (e.g., v3.3)'
        required: true
        default: 'v3.3'

jobs:
  winget-first-submission:
    runs-on: windows-latest
    env:
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
      WINGETCREATE_VERSION: v1.12.8.0
      WINGETCREATE_SHA256: 8BD738851B524885410112678E3771B341C5C716DE60FBBECB88AB0A363ED85D
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Download and verify wingetcreate.exe
        shell: pwsh
        run: |
          $url = "https://github.com/microsoft/winget-create/releases/download/$env:WINGETCREATE_VERSION/wingetcreate.exe"
          Invoke-WebRequest -Uri $url -OutFile wingetcreate.exe
          $actual = (Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash
          if ($actual -ne $env:WINGETCREATE_SHA256) {
            Write-Error "SHA256 mismatch: expected $env:WINGETCREATE_SHA256 got $actual"
            exit 1
          }

      - name: Print installer URL + instructions
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $installerUrl = "https://github.com/scottkw/agenthub/releases/download/$tag/agenthub-$tag-windows-amd64-installer.exe"
          Write-Host "================================================================"
          Write-Host "WinGet first-submission session for $tag"
          Write-Host ""
          Write-Host "After connecting via tmate, run:"
          Write-Host ""
          Write-Host "  .\wingetcreate.exe new $installerUrl"
          Write-Host ""
          Write-Host "Interactive prompts you will fill in:"
          Write-Host "  PackageIdentifier:   scottkw.agenthub"
          Write-Host "  PackageVersion:      $($tag.TrimStart('v'))"
          Write-Host "  Publisher:           Ken Scott"
          Write-Host "  PackageName:         AgentHub"
          Write-Host "  Moniker:             agenthub"
          Write-Host "  License:             MIT"
          Write-Host "  ShortDescription:    Tabbed terminal sessions for AI coding CLIs"
          Write-Host "  Tags:                ai cli terminal claude opencode codex gemini wails"
          Write-Host ""
          Write-Host "When prompted to submit: answer 'y'."
          Write-Host "The token is preloaded via WINGET_CREATE_GITHUB_TOKEN env var."
          Write-Host "================================================================"

      - name: Open interactive tmate session
        uses: mxschmitt/action-tmate@7b6a61a73bbb9793cb80ad69b8dd8ac19261834c # v3.22
        with:
          limit-access-to-actor: true
          detached: false
